<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>CityCommand AI — Chrome Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Outfit:wght@500;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-color: #020617;
      --bg-panel: rgba(15, 23, 42, 0.55);
      --bg-panel-hover: rgba(30, 41, 59, 0.7);
      --border-color: rgba(148, 163, 184, 0.15);
      --border-hover: rgba(56, 189, 248, 0.4);
      
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      
      --brand-primary: #0ea5e9;
      --brand-gradient: linear-gradient(135deg, #38bdf8, #8b5cf6);
      
      --status-good: #10b981;
      --status-warn: #f59e0b;
      --status-danger: #ef4444;
      --status-info: #3b82f6;
      
      --shadow-sm: 0 4px 20px -2px rgba(0, 0, 0, 0.4);
      --shadow-glow: 0 0 30px -5px rgba(56, 189, 248, 0.3);
      --shadow-glow-danger: 0 0 30px -5px rgba(239, 68, 68, 0.3);
      
      --radius-sm: 12px;
      --radius-md: 20px;
      --radius-lg: 28px;
    }

    * { box-sizing: border-box; }
    
    body {
      margin: 0;
      font-family: 'Inter', system-ui, sans-serif;
      background-color: var(--bg-color);
      background-image: 
        radial-gradient(circle at 15% 0%, rgba(56, 189, 248, 0.15) 0%, transparent 40%),
        radial-gradient(circle at 85% 100%, rgba(139, 92, 246, 0.15) 0%, transparent 40%);
      background-attachment: fixed;
      color: var(--text-main);
      min-height: 100vh;
      line-height: 1.5;
    }

    h1, h2, h3, h4 { font-family: 'Outfit', sans-serif; margin: 0; }
    button, input, select, textarea { font: inherit; }
    button { cursor: pointer; border: none; outline: none; }

    /* Layout */
    .app { display: grid; grid-template-columns: 280px 1fr; min-height: 100vh; }
    
    /* Sidebar */
    aside {
      border-right: 1px solid var(--border-color);
      background: rgba(2, 6, 23, 0.7);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      padding: 28px 20px;
      position: sticky;
      top: 0;
      height: 100vh;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 32px;
      z-index: 10;
    }
    
    .logo { display: flex; align-items: center; gap: 14px; }
    .logo-mark {
      width: 48px; height: 48px; border-radius: 14px;
      background: var(--brand-gradient);
      display: grid; place-items: center; font-weight: 900; font-size: 20px; color: #fff;
      box-shadow: var(--shadow-glow);
    }
    .logo h1 { font-size: 20px; letter-spacing: -0.02em; }
    .logo p { margin: 2px 0 0; color: var(--brand-primary); font-size: 13px; font-weight: 500; text-transform: uppercase; letter-spacing: 0.1em; }

    nav { display: grid; gap: 8px; }
    .nav-btn {
      width: 100%; border: 1px solid transparent; border-radius: var(--radius-sm); padding: 12px 16px;
      background: transparent; color: var(--text-muted); display: flex; align-items: center; gap: 14px;
      text-align: left; transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .nav-btn:hover { background: rgba(255, 255, 255, 0.04); color: var(--text-main); transform: translateX(4px); }
    .nav-btn.active {
      background: linear-gradient(90deg, rgba(56, 189, 248, 0.1), transparent);
      border-left: 3px solid var(--brand-primary); color: var(--text-main);
      border-radius: 0 var(--radius-sm) var(--radius-sm) 0;
    }
    .nav-icon { font-size: 20px; width: 28px; text-align: center; }

    .connection-status {
      margin-top: auto; padding: 16px; border-radius: var(--radius-sm);
      border: 1px solid var(--border-color); background: rgba(0,0,0,0.2);
      display: flex; align-items: center; gap: 12px; font-size: 13px;
    }
    .status-indicator { width: 10px; height: 10px; border-radius: 50%; background: var(--status-good); box-shadow: 0 0 10px var(--status-good); }
    .status-indicator.offline { background: var(--status-danger); box-shadow: 0 0 10px var(--status-danger); }

    /* Main Area */
    main { padding: 32px 40px; max-width: 1600px; width: 100%; margin: 0 auto; }
    
    .topbar { display: flex; justify-content: space-between; align-items: flex-start; gap: 24px; margin-bottom: 32px; flex-wrap: wrap; }
    .title h2 { font-size: clamp(28px, 4vw, 36px); font-weight: 800; letter-spacing: -0.03em; }
    .title p { margin: 8px 0 0; color: var(--text-muted); max-width: 700px; font-size: 15px; }
    
    .actions { display: flex; gap: 12px; flex-wrap: wrap; }
    .btn {
      border: 1px solid var(--border-color); border-radius: var(--radius-sm); padding: 12px 20px;
      color: var(--text-main); background: var(--bg-panel); 
      font-weight: 600; font-size: 14px; letter-spacing: 0.02em;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      backdrop-filter: blur(10px);
    }
    .btn:hover { border-color: var(--border-hover); background: var(--bg-panel-hover); transform: translateY(-2px); box-shadow: var(--shadow-sm); }
    .btn.primary { background: var(--brand-gradient); color: #fff; border: none; box-shadow: var(--shadow-glow); }
    .btn.primary:hover { box-shadow: 0 0 40px -5px rgba(139, 92, 246, 0.6); transform: translateY(-3px) scale(1.02); }
    .btn.danger { border-color: rgba(239, 68, 68, 0.4); color: #fca5a5; background: rgba(239, 68, 68, 0.1); }
    .btn.danger:hover { background: rgba(239, 68, 68, 0.2); box-shadow: var(--shadow-glow-danger); }

    /* Utilities */
    .grid { display: grid; gap: 24px; }
    .cols-4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
    .cols-3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    .cols-2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .split { display: grid; grid-template-columns: 1.2fr 0.8fr; gap: 24px; }
    
    .pill {
      display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px;
      border-radius: 99px; font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em;
      background: rgba(148, 163, 184, 0.1); color: var(--text-muted); border: 1px solid var(--border-color);
    }
    .pill.critical { background: rgba(239, 68, 68, 0.15); color: #fca5a5; border-color: rgba(239, 68, 68, 0.3); }
    .pill.high { background: rgba(245, 158, 11, 0.15); color: #fcd34d; border-color: rgba(245, 158, 11, 0.3); }
    .pill.medium { background: rgba(56, 189, 248, 0.15); color: #7dd3fc; border-color: rgba(56, 189, 248, 0.3); }
    .pill.good { background: rgba(16, 185, 129, 0.15); color: #6ee7b7; border-color: rgba(16, 185, 129, 0.3); }

    /* Cards (Glassmorphism) */
    .card {
      background: var(--bg-panel);
      backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-md);
      padding: 24px;
      box-shadow: var(--shadow-sm);
      transition: all 0.3s ease;
      position: relative;
      overflow: hidden;
    }
    .card:hover { border-color: rgba(255,255,255,0.1); background: var(--bg-panel-hover); }
    .card::before {
      content: ''; position: absolute; top: 0; left: 0; right: 0; height: 1px;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.1), transparent);
    }
    
    .card-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 20px; gap: 12px; }
    .card-header h3 { font-size: 20px; margin-bottom: 4px; }
    .sub { color: var(--text-muted); font-size: 13px; font-weight: 500; }

    /* Metrics */
    .metric { padding: 24px; display: flex; flex-direction: column; justify-content: center; }
    .metric .label { color: var(--text-muted); font-size: 14px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; }
    .metric .value { font-family: 'Outfit', sans-serif; font-size: 42px; font-weight: 800; line-height: 1.1; margin: 12px 0; }
    .metric .orb { position: absolute; right: -20%; bottom: -20%; width: 140px; height: 140px; border-radius: 50%; opacity: 0.15; filter: blur(30px); }

    /* Lists */
    .list { display: grid; gap: 12px; }
    .item {
      background: rgba(0, 0, 0, 0.2); border: 1px solid transparent; border-radius: var(--radius-sm);
      padding: 16px; display: grid; gap: 8px; transition: all 0.2s;
    }
    .item.clickable { cursor: pointer; border-color: var(--border-color); }
    .item.clickable:hover { border-color: var(--border-hover); background: rgba(56, 189, 248, 0.05); transform: translateX(4px); }
    .item-row { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
    .item-title { font-weight: 700; font-size: 15px; }

    /* Map (Stylized) */
    .map-container {
      min-height: 400px; position: relative; border-radius: var(--radius-md); overflow: hidden;
      background: 
        radial-gradient(circle at 50% 50%, rgba(56, 189, 248, 0.05) 0%, transparent 70%),
        linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px),
        #050b14;
      background-size: 100% 100%, 40px 40px, 40px 40px;
      border: 1px solid var(--border-color);
    }
    .map-label { position: absolute; left: 20px; top: 20px; z-index: 2; }
    
    .pin { position: absolute; transform: translate(-50%, -50%); display: grid; place-items: center; }
    .pin::before {
      content: ''; width: 20px; height: 20px; border-radius: 50%; 
      background: var(--status-danger); box-shadow: 0 0 0 0 rgba(239,68,68, 0.5);
      animation: ping 2s cubic-bezier(0, 0, 0.2, 1) infinite;
    }
    .pin::after { content: ''; position: absolute; width: 12px; height: 12px; border-radius: 50%; background: #fff; }
    .pin.res::before { background: var(--brand-primary); animation: ping-blue 2s cubic-bezier(0, 0, 0.2, 1) infinite; }
    
    @keyframes ping { 75%, 100% { transform: scale(3); opacity: 0; box-shadow: 0 0 0 10px rgba(239,68,68, 0); } }
    @keyframes ping-blue { 75%, 100% { transform: scale(3); opacity: 0; box-shadow: 0 0 0 10px rgba(56,189,248, 0); } }

    /* Progress bar */
    .bar { height: 6px; border-radius: 99px; background: rgba(255,255,255,0.1); overflow: hidden; margin: 4px 0; }
    .bar > span { display: block; height: 100%; border-radius: 99px; background: var(--brand-gradient); box-shadow: 0 0 10px rgba(56, 189, 248, 0.8); }

    /* Timeline / Trace */
    .timeline { position: relative; padding-left: 24px; display: grid; gap: 20px; }
    .timeline::before { content: ''; position: absolute; left: 8px; top: 8px; bottom: 8px; width: 2px; background: linear-gradient(to bottom, var(--brand-primary), transparent); opacity: 0.3; }
    .step { position: relative; background: rgba(0,0,0,0.2); border: 1px solid var(--border-color); border-radius: var(--radius-sm); padding: 16px; }
    .step::before {
      content: ''; position: absolute; left: -21px; top: 20px; width: 10px; height: 10px; border-radius: 50%;
      background: var(--brand-primary); box-shadow: 0 0 0 4px rgba(56, 189, 248, 0.2);
    }
    .step.done::before { background: var(--status-good); box-shadow: 0 0 0 4px rgba(16, 185, 129, 0.2); }

    /* Codebox */
    .codebox { font-family: ui-monospace, monospace; font-size: 13px; background: #000; border: 1px solid var(--border-color); border-radius: var(--radius-sm); padding: 16px; color: #a5b4fc; overflow-x: auto; }

    /* Toast */
    .toast {
      position: fixed; right: 32px; bottom: 32px; background: rgba(15, 23, 42, 0.9); backdrop-filter: blur(10px);
      border: 1px solid var(--brand-primary); border-radius: var(--radius-sm); padding: 16px 20px;
      box-shadow: var(--shadow-glow); display: none; max-width: 400px; z-index: 100;
      transform: translateY(20px); opacity: 0; transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    .toast.show { display: block; transform: translateY(0); opacity: 1; }
    .toast.error { border-color: var(--status-danger); box-shadow: var(--shadow-glow-danger); }

    /* Sections */
    .section { display: none; opacity: 0; transform: translateY(10px); transition: all 0.3s ease; }
    .section.active { display: block; opacity: 1; transform: translateY(0); }

    /* Responsive */
    @media (max-width: 1200px) { .cols-4 { grid-template-columns: repeat(2, 1fr); } .split { grid-template-columns: 1fr; } }
    @media (max-width: 900px) { .app { grid-template-columns: 1fr; } aside { position: static; height: auto; border-right: none; border-bottom: 1px solid var(--border-color); flex-direction: row; flex-wrap: wrap; align-items: center; } nav { display: flex; flex-wrap: wrap; width: 100%; } .nav-btn { width: auto; } .connection-status { margin-left: auto; } main { padding: 24px 20px; } .cols-3 { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <div class="app">
    <aside>
      <div class="logo">
        <div class="logo-mark">CC</div>
        <div>
          <h1>CityCommand AI</h1>
          <p>Agentic Orchestrator</p>
        </div>
      </div>
      <nav id="nav"></nav>
      <div class="connection-status">
        <div id="apiStatusDot" class="status-indicator offline"></div>
        <span id="apiStatusText">Connecting to Backend...</span>
      </div>
    </aside>
    
    <main>
      <div class="topbar">
        <div class="title">
          <h2 id="pageTitle">Dashboard</h2>
          <p id="pageDesc">Connecting to FastAPI backend...</p>
        </div>
        <div class="actions">
          <button class="btn danger" onclick="apiResetDemo()">Reset State</button>
          <button class="btn primary" onclick="apiRunScenario()">▶ Run AI Pipeline</button>
        </div>
      </div>

      <div id="dashboard" class="section active"></div>
      <div id="incidents" class="section"></div>
      <div id="analysis" class="section"></div>
      <div id="signals" class="section"></div>
      <div id="trace" class="section"></div>
      
    </main>
  </div>
  
  <div id="toast" class="toast"></div>

  <script>
    // --- Configuration ---
    const API_BASE = 'http://localhost:8000';
    
    // --- State ---
    let state = {
      demoLoaded: false,
      stats: { total_signals: 0, active_incidents: 0, total_incidents: 0, available_resources: 0, total_traces: 0 },
      incidents: [],
      signals: [],
      traces: [],
      selectedIncident: null, // Full incident detail object
      selectedIncidentId: null,
    };
    
    let currentTab = 'dashboard';

    // --- Navigation ---
    const navItems = [
      { id: 'dashboard', label: 'Command Center', icon: '🌍', desc: 'Live operational overview and metrics' },
      { id: 'incidents', label: 'Incident Queue', icon: '🚨', desc: 'Prioritized list of active threats' },
      { id: 'analysis', label: 'AI Analysis', icon: '🧠', desc: 'Deep dive into agent classifications and evidence' },
      { id: 'signals', label: 'Signal Intake', icon: '📡', desc: 'Raw reports and sensory inputs' },
      { id: 'trace', label: 'Agent Trace', icon: '🧾', desc: 'Explainable AI decision lineage' }
    ];

    function renderNav() {
      document.getElementById('nav').innerHTML = navItems.map(n => `
        <button class="nav-btn ${n.id === currentTab ? 'active' : ''}" onclick="go('${n.id}')">
          <span class="nav-icon">${n.icon}</span>
          <span style="font-weight:600">${n.label}</span>
        </button>
      `).join('');
    }

    function go(id) {
      currentTab = id;
      document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
      document.getElementById(id).classList.add('active');
      
      const navItem = navItems.find(n => n.id === id);
      document.getElementById('pageTitle').textContent = navItem.label;
      document.getElementById('pageDesc').textContent = navItem.desc;
      
      renderNav();
      renderCurrentView();
    }

    // --- Utility Functions ---
    function formatSev(sev) {
        if(!sev) return 'UNKNOWN';
        return sev.toUpperCase();
    }
    
    function sevClass(sev) {
      if(!sev) return 'medium';
      const s = sev.toUpperCase();
      if(s === 'CRITICAL') return 'critical';
      if(s === 'HIGH') return 'high';
      return 'medium';
    }
    
    function percent(n) { return Math.round((n || 0) * 100); }
    
    function showToast(title, msg, isError=false) {
      const el = document.getElementById('toast');
      el.className = `toast ${isError ? 'error' : ''}`;
      el.innerHTML = `<h4 style="margin:0; font-size:16px;">${title}</h4><div style="color:var(--text-muted); font-size:14px; margin-top:4px;">${msg}</div>`;
      
      // trigger reflow to restart animation if already showing
      void el.offsetWidth;
      el.classList.add('show');
      
      setTimeout(() => el.classList.remove('show'), 4000);
    }

    // --- API Integration ---
    async function apiFetch(endpoint, options = {}) {
      try {
        const res = await fetch(`${API_BASE}${endpoint}`, {
          ...options,
          headers: { 'Content-Type': 'application/json', ...options.headers }
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.detail || `HTTP error ${res.status}`);
        return data;
      } catch (err) {
        console.error('API Error:', err);
        throw err;
      }
    }

    async function checkHealth() {
      try {
        const data = await apiFetch('/demo/status');
        document.getElementById('apiStatusDot').className = 'status-indicator';
        document.getElementById('apiStatusText').textContent = 'Backend Online';
        
        state.demoLoaded = data.data.demo_loaded;
        state.stats = data.data.stats || state.stats;
        
        if (state.demoLoaded) {
            await fetchAllData();
        } else {
            // Clear arrays if demo not loaded
            state.incidents = [];
            state.signals = [];
            state.selectedIncident = null;
        }
        renderCurrentView();
      } catch (err) {
        document.getElementById('apiStatusDot').className = 'status-indicator offline';
        document.getElementById('apiStatusText').textContent = 'Backend Offline';
        showToast('Connection Failed', 'Ensure FastAPI is running on port 8000.', true);
      }
    }

    async function fetchAllData() {
        try {
            const incRes = await apiFetch('/incidents');
            state.incidents = incRes.data || [];
            
            // Auto select first incident if none selected
            if (state.incidents.length > 0 && !state.selectedIncidentId) {
                await selectIncident(state.incidents[0].id, false);
            } else if (state.selectedIncidentId) {
                await selectIncident(state.selectedIncidentId, false);
            }
            
            // Optional: fetch signals for dashboard list, though backend /signals isn't explicitly defined in standard crud, 
            // the main.py exports a signals router. Let's gracefully try.
            try {
                const sigRes = await apiFetch('/signals');
                state.signals = sigRes.data || [];
            } catch(e) { console.log('Could not fetch signals directly'); }
            
        } catch (e) {
            console.error(e);
        }
    }

    async function selectIncident(id, navigate=true) {
        state.selectedIncidentId = id;
        try {
            const data = await apiFetch(`/incidents/${id}`);
            state.selectedIncident = data.data;
            if (navigate) go('analysis');
            else renderCurrentView();
        } catch(e) {
            showToast('Error', 'Failed to load incident details', true);
        }
    }

    async function apiRunScenario() {
      if(state.demoLoaded) {
          showToast('Info', 'Demo already loaded. Resetting first...');
          await apiResetDemo(false);
      }
      showToast('Running Pipeline', 'Agents are processing the scenario...');
      try {
        const res = await apiFetch('/demo/run-scenario', { method: 'POST' });
        showToast('Pipeline Complete', `Created ${res.data.incidents_created} incidents.`);
        await checkHealth();
      } catch(e) {
        showToast('Pipeline Error', e.message, true);
      }
    }

    async function apiResetDemo(refresh=true) {
      try {
        await apiFetch('/demo/reset', { method: 'POST' });
        if(refresh) {
            showToast('Reset Complete', 'Data store has been wiped.');
            await checkHealth();
            go('dashboard');
        }
      } catch(e) {
        showToast('Reset Error', e.message, true);
      }
    }

    // --- Renderers ---
    
    function renderDashboard() {
      const el = document.getElementById('dashboard');
      if (!state.demoLoaded) {
          el.innerHTML = `<div class="card" style="text-align:center; padding: 60px 20px;">
              <div class="logo-mark" style="margin: 0 auto 20px; width:64px; height:64px; font-size: 28px;">CC</div>
              <h2>Ready to initialize</h2>
              <p class="sub" style="margin-bottom: 24px;">The data store is empty. Run the AI pipeline to ingest the seed scenario.</p>
              <button class="btn primary" onclick="apiRunScenario()" style="padding: 14px 32px; font-size: 16px;">Run Scenario</button>
          </div>`;
          return;
      }

      el.innerHTML = `
        <div class="grid cols-4">
          <div class="card metric">
            <div class="label">Active Incidents</div>
            <div class="value">${state.stats.active_incidents || 0}</div>
            <div class="sub">Prioritized threats</div>
            <div class="orb" style="background:var(--status-danger)"></div>
          </div>
          <div class="card metric">
            <div class="label">Signals Processed</div>
            <div class="value">${state.stats.total_signals || 0}</div>
            <div class="sub">Raw intelligence items</div>
            <div class="orb" style="background:var(--brand-primary)"></div>
          </div>
          <div class="card metric">
            <div class="label">Agent Traces</div>
            <div class="value">${state.stats.total_traces || 0}</div>
            <div class="sub">Explainable decisions</div>
            <div class="orb" style="background:#8b5cf6"></div>
          </div>
          <div class="card metric">
            <div class="label">Active Resources</div>
            <div class="value">${(state.stats.total_resources || 0) - (state.stats.available_resources || 0)}</div>
            <div class="sub">Units deployed</div>
            <div class="orb" style="background:var(--status-good)"></div>
          </div>
        </div>

        <div class="split" style="margin-top: 32px">
          <div class="card map-container">
            <div class="map-label"><span class="pill good">Islamabad Live Grid</span></div>
            ${state.incidents.map((i, idx) => `
                <div class="pin" title="${i.title}" style="left:${35 + idx*30}%; top:${45 + idx*20}%;"></div>
            `).join('')}
          </div>
          
          <div class="grid">
            <div class="card">
                <div class="card-header">
                    <div><h3>Priority Queue</h3><div class="sub">Highest impact active incidents</div></div>
                </div>
                <div class="list">
                    ${state.incidents.map(i => `
                        <div class="item clickable" onclick="selectIncident('${i.id}')">
                            <div class="item-row">
                                <span class="item-title">${i.title}</span>
                                <span class="pill ${sevClass(i.severity)}">${formatSev(i.severity)}</span>
                            </div>
                            <div class="item-row" style="margin-top: 4px;">
                                <span class="sub">${percent(i.confidence)}% Confidence</span>
                                <span class="sub">${i.assignment_count || 0} units assigned</span>
                            </div>
                        </div>
                    `).join('')}
                </div>
            </div>
          </div>
        </div>
      `;
    }

    function renderIncidents() {
      const el = document.getElementById('incidents');
      el.innerHTML = `
        <div class="card">
            <div class="card-header">
                <div><h3>Incident Registry</h3><div class="sub">All threats scored by AI</div></div>
                <span class="pill">${state.incidents.length} Records</span>
            </div>
            <div class="list">
                ${state.incidents.map(i => `
                    <div class="item clickable" onclick="selectIncident('${i.id}')">
                        <div class="item-row">
                            <div>
                                <div class="item-row" style="justify-content: flex-start;">
                                    <span class="item-title">${i.title}</span>
                                    <span class="pill ${sevClass(i.severity)}">${formatSev(i.severity)}</span>
                                </div>
                                <div class="sub" style="margin-top: 6px;">ID: ${i.id} · Created: ${new Date(i.created_at).toLocaleTimeString()}</div>
                            </div>
                            <div style="text-align: right; width: 120px;">
                                <div class="sub">Priority</div>
                                <div class="bar"><span style="width: ${i.priority_score || 0}%"></span></div>
                                <strong style="font-size:18px;">${Math.round(i.priority_score || 0)}</strong>
                            </div>
                        </div>
                    </div>
                `).join('')}
            </div>
        </div>
      `;
    }

    function renderAnalysis() {
        const el = document.getElementById('analysis');
        const inc = state.selectedIncident;
        
        if (!inc) {
            el.innerHTML = `<div class="card"><p class="sub">Select an incident from the queue to view analysis.</p></div>`;
            return;
        }

        const sev = inc.severity_prediction || {};
        const asgns = inc.resource_assignments || [];
        const signals = inc.signals || [];
        
        el.innerHTML = `
            <div class="split">
                <div class="card">
                    <div class="card-header">
                        <div>
                            <div style="display:flex; gap:12px; align-items:center;">
                                <span class="pill ${sevClass(inc.severity)}">${formatSev(inc.severity)}</span>
                                <h3>${inc.title}</h3>
                            </div>
                            <div class="sub" style="margin-top:6px">${inc.id} · ${inc.location?.area || 'Unknown Area'}</div>
                        </div>
                    </div>
                    
                    <div class="grid cols-2" style="margin: 24px 0; background:rgba(0,0,0,0.2); padding:20px; border-radius:var(--radius-sm); border:1px solid var(--border-color);">
                        <div>
                            <div class="sub">AI Confidence</div>
                            <div class="bar" style="margin: 8px 0; width:80%;"><span style="width:${percent(inc.confidence)}%"></span></div>
                            <h2 style="font-family:'Inter';">${percent(inc.confidence)}%</h2>
                        </div>
                        <div>
                            <div class="sub">Status</div>
                            <h3 style="margin-top: 10px; color:${inc.status === 'active' ? 'var(--brand-primary)' : 'var(--status-warn)'}">${inc.status.replace(/_/g, ' ').toUpperCase()}</h3>
                            ${inc.human_review_required ? `<span class="pill critical" style="margin-top:8px;">Human Review Req.</span>` : ''}
                        </div>
                    </div>

                    <h4>Severity Prediction</h4>
                    <div class="grid cols-3" style="margin-top:12px; margin-bottom: 24px;">
                        <div><div class="sub">Population Risk</div><div style="font-weight:700">${sev.population_affected || 'N/A'}</div></div>
                        <div><div class="sub">Est. Duration</div><div style="font-weight:700">${sev.duration_min || 0} min</div></div>
                        <div><div class="sub">Spread Risk</div><div style="font-weight:700">${sev.spread_risk || 'N/A'}</div></div>
                    </div>
                    
                    <h4>Resource Allocations</h4>
                    <div class="list" style="margin-top: 12px;">
                        ${asgns.length === 0 ? '<span class="sub">No resources assigned.</span>' : asgns.map(a => `
                            <div class="item">
                                <div class="item-row">
                                    <strong>${a.resource_name}</strong>
                                    <span class="pill medium">ETA: ${a.eta_min}m</span>
                                </div>
                                <div class="sub">${a.priority_reason}</div>
                            </div>
                        `).join('')}
                    </div>
                </div>
                
                <div class="grid">
                    <div class="card">
                        <h3>Alternative Hypotheses</h3>
                        <div class="list" style="margin-top:16px;">
                            ${(!inc.alternate_hypotheses || inc.alternate_hypotheses.length === 0) ? 
                                '<div class="sub">No credible alternate hypotheses generated. AI is highly confident in primary.</div>' : 
                                inc.alternate_hypotheses.map(alt => `
                                <div class="item" style="border-left: 3px solid var(--status-warn);">
                                    <div class="item-row">
                                        <strong>${(alt.type || '').replace(/_/g, ' ').toUpperCase()}</strong>
                                        <span class="pill">${percent(alt.confidence)}%</span>
                                    </div>
                                    <div class="sub">${alt.reason}</div>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                    
                    <div class="card">
                        <h3>Corroborating Signals</h3>
                        <div class="list" style="margin-top:16px;">
                            ${signals.length === 0 ? '<div class="sub">No linked signals loaded.</div>' : signals.slice(0,3).map(s => `
                                <div class="item">
                                    <div class="item-row">
                                        <span class="pill">${s.source_type}</span>
                                        <span class="sub">${new Date(s.timestamp).toLocaleTimeString()}</span>
                                    </div>
                                    <div style="font-size:13px; margin-top:8px; font-family:monospace; color:var(--brand-primary);">${s.normalized_text?.substring(0, 80)}...</div>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                </div>
            </div>
        `;
    }
    
    function renderTrace() {
        const el = document.getElementById('trace');
        const inc = state.selectedIncident;
        
        if (!inc) {
            el.innerHTML = `<div class="card"><p class="sub">Select an incident to view its agent trace.</p></div>`;
            return;
        }

        const traces = inc.traces || [];
        
        el.innerHTML = `
            <div class="card">
                <div class="card-header">
                    <div>
                        <h3>Explainable AI Pipeline Trace</h3>
                        <div class="sub">Deterministic execution log for ${inc.title}</div>
                    </div>
                    <span class="pill good">${traces.length} steps logged</span>
                </div>
                <div class="timeline" style="margin-top: 24px;">
                    ${traces.length === 0 ? '<div class="sub">No trace data found.</div>' : traces.map(t => `
                        <div class="step done">
                            <div class="item-row">
                                <h4 style="color:var(--brand-primary);">${t.agent_name} <span class="sub" style="font-weight:400; font-family:'Inter'">:: ${t.step}</span></h4>
                                <span class="pill">${t.duration_ms}ms</span>
                            </div>
                            <div class="grid cols-2" style="margin-top: 12px; gap: 16px;">
                                <div><div class="sub">Input Context</div><div style="font-size:13px; margin-top:4px;">${t.input_summary}</div></div>
                                <div><div class="sub">Agent Output</div><div style="font-size:13px; margin-top:4px; font-weight:600; color:var(--text-main);">${t.output_summary}</div></div>
                            </div>
                            ${t.tool_calls?.length > 0 ? `
                                <div class="codebox" style="margin-top: 12px; padding: 10px;">> Executed: ${t.tool_calls.join(', ')}</div>
                            ` : ''}
                        </div>
                    `).join('')}
                </div>
            </div>
        `;
    }
    
    function renderSignals() {
         const el = document.getElementById('signals');
         const signals = state.signals || [];
         
         el.innerHTML = `
             <div class="card">
                 <div class="card-header">
                     <div><h3>Raw Intake Feed</h3><div class="sub">Signals ingested before classification</div></div>
                     <span class="pill">${signals.length} records</span>
                 </div>
                 <div class="list">
                     ${signals.length === 0 ? '<div class="sub">No signals loaded.</div>' : signals.map(s => `
                         <div class="item">
                             <div class="item-row">
                                 <strong>${s.id} · <span style="text-transform:uppercase">${s.source_type}</span></strong>
                                 <span class="sub">${new Date(s.timestamp).toLocaleTimeString()}</span>
                             </div>
                             <p style="font-size:14px; margin: 8px 0;">${s.raw_text || s.normalized_text}</p>
                             <div class="codebox" style="padding:8px; font-size:12px;">Location: ${s.location_text || 'N/A'} | Credibility Score: ${(s.metadata?.credibility_score || 0).toFixed(2)}</div>
                         </div>
                     `).join('')}
                 </div>
             </div>
         `;
    }

    function renderCurrentView() {
        if(currentTab === 'dashboard') renderDashboard();
        if(currentTab === 'incidents') renderIncidents();
        if(currentTab === 'analysis') renderAnalysis();
        if(currentTab === 'trace') renderTrace();
        if(currentTab === 'signals') renderSignals();
    }

    // --- Boot ---
    renderNav();
    checkHealth(); // start
  </script>
</body>
</html>
